[package]
name = "edcb-to-epgstation"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "edcb_to_epgstation_ts"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = "0.37"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
